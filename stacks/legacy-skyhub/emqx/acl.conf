%% SkyHub Core: read device reports and send explicitly enabled services.
{allow, {user, "skyhub-core"}, subscribe, ["sys/product/+/status", "thing/product/+/osd", "thing/product/+/state", "thing/product/+/events", "thing/product/+/services_reply"]}.
{allow, {user, "skyhub-core"}, publish, ["sys/product/+/status_reply", "thing/product/+/services"]}.

%% DJI Gateway: report device state and receive cloud replies/services.
{allow, {user, "dji-gateway"}, publish, ["sys/product/+/status", "thing/product/+/osd", "thing/product/+/state", "thing/product/+/events", "thing/product/+/services_reply"]}.
{allow, {user, "dji-gateway"}, subscribe, ["sys/product/+/status_reply", "thing/product/+/services"]}.

{deny, all}.
