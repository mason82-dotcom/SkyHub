# SkyHub Next's dedicated shared MinIO runtime for this Raspberry Pi.
# Intentionally separate from SkyHub's postgres/redis/backend Compose.
# Never combine this file with docker-compose.yml or the media profile.
#
# Site-specific facts audited 2026-10-21:
# Existing MinIO data: /mnt/hc4backup/aeronexus-data/minio (mounted ext4 NVMe)
# Existing local image: linux/arm64 aeronexus/minio:RELEASE.2025-10-15T17-29-55Z-an1
#
# Deployment is opt-in via scripts/pi-minio-shared-runtime.sh; default is plan.
name: skyhub-storage
services:
  minio:
    container_name: skyhub-shared-minio
    image: aeronexus/minio:RELEASE.2025-10-15T17-29-55Z-an1
    pull_policy: never
    restart: "no"  # No restart before a systemd mount dependency is configured.
    entrypoint: ["/usr/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - path: ${SKYHUB_SHARED_MINIO_CREDENTIALS_FILE:?Set private MinIO env file}
        format: raw
    volumes:
      - type: bind
        source: /mnt/hc4backup/aeronexus-data/minio
        target: /data
        bind:
          create_host_path: false
    networks:
      storage:
        aliases: [skyhub-minio]
    # Deliberately no ports: S3 :9000 is available only on skyhub-storage-net.
    # Even port 9001 is not published, including on loopback.

networks:
  storage:
    external: true
    name: skyhub-storage-net
