<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyHub Next · DJI Operations</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#07111e;--panel:#101f30;--edge:#2c4054;--muted:#94abc1;--blue:#47c3e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf6ff;font:14px system-ui,sans-serif}
header{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--edge)}
h1{margin:0;font-size:20px;letter-spacing:.04em}h1 span{color:var(--blue)}small,.muted{color:var(--muted)}
.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.auth input{min-width:205px}
input,button{padding:9px 11px;border:1px solid #40576d;border-radius:8px;background:#1b2b3d;color:white}
button{background:#087d96;font-weight:700;cursor:pointer}button:hover{background:#099ab8}
main{display:grid;grid-template-columns:minmax(0,1fr) 355px;height:calc(100vh - 66px)}
#map{width:100%;height:100%;min-height:350px}
aside{background:var(--panel);border-left:1px solid var(--edge);padding:14px;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile,.device{border:1px solid var(--edge);border-radius:10px;background:#14263a;padding:11px}
.tile strong{display:block;font-size:25px;margin-top:3px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin:18px 0 10px;color:var(--muted)}
#devices{display:grid;gap:8px}.device .head{display:flex;justify-content:space-between;gap:10px;overflow-wrap:anywhere}
.device .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.device .metrics strong{display:block;margin-top:2px}
.state{font-size:12px;color:#84dfb8;white-space:nowrap}.state.stale{color:#efb77b}
.notice{border:1px solid #655338;border-radius:8px;padding:10px;color:#dfc69f;font-size:12px;line-height:1.5;margin-bottom:12px}
#message{font-size:12px;color:var(--muted)}
@media(max-width:850px){header{height:auto;flex-direction:column;align-items:flex-start}main{grid-template-columns:1fr;height:auto}#map{height:45vh}aside{border-left:0}}
</style>
</head>
<body>
<header>
  <h1>SKY<span>HUB</span> NEXT <small>· read-only</small></h1>
  <div class="auth">
    <input id="token" type="password" placeholder="SkyHub Zugriffstoken" aria-label="Zugriffstoken" autocomplete="off">
    <button id="connect">Verbinden</button>
    <span id="message" role="status">Nicht verbunden</span>
  </div>
</header>
<main>
  <div id="map" aria-label="Drohnenkarte"></div>
  <aside>
    <div class="notice">Nur Monitoring. Keine Flugsteuerung. Nicht empfangene Messwerte erscheinen als —. Die Karte benötigt eine Internetverbindung.</div>
    <div class="grid">
      <div class="tile"><small>Bekannte Geräte</small><strong id="count">0</strong></div>
      <div class="tile"><small>Frische Telemetrie</small><strong id="live">0</strong></div>
    </div>
    <h2>DJI Geräte · Topologie · Live-Telemetrie</h2>
    <div id="devices"><p class="muted">Mit Zugriffstoken verbinden.</p></div>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
'use strict';
const el=id=>document.getElementById(id);
const map=window.L?L.map('map').setView([51.1657,10.4515],6):null;
if(map)L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
const records=new Map(),markers=new Map();
let socket=null,centered=false;
const show=(x,suffix='')=>typeof x==='number'&&Number.isFinite(x)?String(Math.round(x*100)/100)+suffix:'—';
const fresh=d=>Number.isFinite(d.lastTelemetryAt)&&Date.now()>=d.lastTelemetryAt&&Date.now()-d.lastTelemetryAt<15000;
const positionFresh=d=>Number.isFinite(d.lastPositionAt)&&Date.now()>=d.lastPositionAt&&Date.now()-d.lastPositionAt<15000;
function update(){
  const data=[...records.values()].sort((a,b)=>(b.lastSeenAt||0)-(a.lastSeenAt||0));
  el('count').textContent=data.length;
  el('live').textContent=data.filter(fresh).length;
  const root=el('devices');root.replaceChildren();
  if(!data.length){const p=document.createElement('p');p.className='muted';p.textContent='Noch keine Telemetrie empfangen.';root.append(p);}
  for(const d of data){
    const card=document.createElement('div');card.className='device';
    const head=document.createElement('div');head.className='head';
    const name=document.createElement('strong');
    name.textContent=d.modelName ? d.modelName+' · '+d.sn : d.sn;
    const state=document.createElement('span');state.className='state'+(fresh(d)?'':' stale');
    state.textContent=fresh(d)?'● OSD frisch':d.topologyOnline===true?'● Verbunden, kein frisches OSD':'● OSD veraltet';
    head.append(name,state);card.append(head);
    const grid=document.createElement('div');grid.className='metrics';
    const t=d.telemetry||{};
    for(const [key,value] of [['Höhe relativ zum Start',show(t.altitude,' m')],['Höhe Ellipsoid',show(t.heightEllipsoid,' m')],['Akku',show(t.battery,' %')],['Horizontalgeschwindigkeit',show(t.horizontalSpeed,' m/s')],['Breite',show(t.latitude)],['Länge',show(t.longitude)]]){
      const cell=document.createElement('div'),caption=document.createElement('small'),number=document.createElement('strong');
      caption.textContent=key;number.textContent=value;cell.append(caption,number);grid.append(cell);
    }
    card.append(grid);
    const meta=document.createElement('small');
    meta.textContent='Rolle: '+(d.role||'unbekannt')+(d.gatewaySn?' · Gateway '+d.gatewaySn:'')+
      (Number.isInteger(d.modeCode)?' · Flugmodus '+d.modeCode:'')+
      (d.firmwareVersion?' · FW '+d.firmwareVersion:'')+
      ' · GPS '+(positionFresh(d)?'frisch':Number.isFinite(d.lastPositionAt)?
        Math.max(0,Math.round((Date.now()-d.lastPositionAt)/1000))+' s alt':'nicht empfangen');
    card.append(meta);root.append(card);
    if(map && typeof t.latitude==='number' && typeof t.longitude==='number' &&
       Math.abs(t.latitude)<=90 && Math.abs(t.longitude)<=180){
      const pos=[t.latitude,t.longitude];
      const markerColor=positionFresh(d)?'#47c3e7':'#748697';
      if(!markers.has(d.sn)){
        const marker=L.circleMarker(pos,{radius:7,color:markerColor}).addTo(map);
        const safeLabel=document.createElement('span');safeLabel.textContent=d.sn;
        marker.bindTooltip(safeLabel);markers.set(d.sn,marker);
      }else{
        markers.get(d.sn).setLatLng(pos);
        markers.get(d.sn).setStyle({color:markerColor});
      }
      if(!centered&&positionFresh(d)&&(pos[0]!==0||pos[1]!==0)){map.setView(pos,13);centered=true;}
    }
  }
}
async function connect(){
  const token=el('token').value.trim();
  if(!token){el('message').textContent='Token fehlt';return;}
  if(socket){socket.disconnect();socket=null;}
  el('message').textContent='Verbinde…';
  try{
    const res=await fetch('/api/devices',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!res.ok)throw new Error('API HTTP '+res.status);
    records.clear();for(const d of await res.json())records.set(d.sn,d);
    update();
    socket=io({auth:{token},reconnectionDelayMax:5000});
    socket.on('connect',()=>{el('message').textContent='Live verbunden';});
    socket.on('connect_error',()=>{el('message').textContent='WebSocket nicht verbunden';});
    socket.on('disconnect',()=>{el('message').textContent='Verbindung getrennt';});
    socket.on('snapshot',list=>{for(const d of list)records.set(d.sn,d);update();});
    socket.on('device_update',d=>{records.set(d.sn,d);update();});
  }catch(err){el('message').textContent=err.message;}
}
el('connect').addEventListener('click',connect);
el('token').addEventListener('keydown',e=>{if(e.key==='Enter')connect();});
setInterval(update,5000);
})();
</script>
</body>
</html>
