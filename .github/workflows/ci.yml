name: SkyHub Next checks

on:
  push:
    branches:
      - main
      - "develop/**"
      - "feature/**"
      - "chore/**"
  pull_request:

permissions:
  contents: read

# Pull requests and their branch pushes should not consume two runners indefinitely.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dji-parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Formerly duplicated across ci.yml and skyhub-next-tests.yml.
      - name: Syntax-check active JavaScript
        run: |
          for file in backend/*.js scripts/*.js frontend/public/*.js; do
            node --check "$file"
          done
      - name: Install locked backend test dependencies
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Validate delivered inline dashboard scripts
        run: node scripts/check-dashboard-inline.js
      - name: Backend unit tests (no broker or DJI hardware)
        run: node --test backend/test/*.test.js

      - name: Validate staging helper and Python tests
        run: |
          python3 -m py_compile scripts/pi-prepare-staging-env.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Syntax-check Pi shell tools (never execute them)
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done
          sh -n stacks/legacy-skyhub/scripts/migrate-env.sh

      - name: Validate isolated Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Syntax-check optional HiveMind lab entrypoints
        run: |
          for script in simulators/hivemind/lab.sh simulators/hivemind/prepare.sh; do
            bash -n "$script"
          done
      - name: Validate HiveMind lab isolation without starting containers
        env:
          SKYHUB_HTTP_PORT: "14001"
          SKYHUB_BIND_ADDRESS: "127.0.0.1"
        run: |
          docker compose -p skyhub-hivemind-lab --env-file .env.example -f docker-compose.yml -f simulators/hivemind/compose.lab.yml config --format json > /tmp/skyhub-hivemind-lab.json
          node -e '
            const c=require("/tmp/skyhub-hivemind-lab.json");
            const b=c.services.backend, m=c.services["hivemind-broker"], s=c.services["hivemind-simulator"];
            if(c.name!=="skyhub-hivemind-lab") throw Error("wrong project");
            if(b.environment.MQTT_BROKER_URL!=="mqtt://hivemind-broker:1884") throw Error("lab MQTT boundary");
            if(b.environment.SKYHUB_PILOT_ENABLED!=="false" || b.environment.SKYHUB_TRACK_RECORDING_ENABLED!=="false") throw Error("unsafe flags");
            if(b.ports.length!==1 || Number(b.ports[0].published)!==14001 || b.ports[0].host_ip!=="127.0.0.1") throw Error("backend host port");
            if((m.ports||[]).length || s.ports.length!==1 || Number(s.ports[0].published)!==19090 || s.ports[0].host_ip!=="127.0.0.1") throw Error("simulator exposure");
            if(!Object.values(c.networks).some(n=>n.internal===true)) throw Error("lab network must be internal");
          '

      - name: Validate explicit ARM64 PostGIS overlay
        run: docker compose -f docker-compose.yml -f docker-compose.arm64.yml --env-file .env.example config --quiet
      - name: Assert Pi MQTT endpoint on port 1884
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); const x=JSON.parse(execFileSync("docker",["compose","--env-file",".env.example","config","--format","json"],{encoding:"utf8"})); const b=x.services.backend.environment; if(b.MQTT_BROKER_URL!=="mqtt://host.docker.internal:1884" || b.SKYHUB_MQTT_REQUIRED_PORT!=="1884") process.exit(1);'
      - name: Assert SkyHub Next remains isolated from the existing Pi backend
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); const x=JSON.parse(execFileSync("docker",["compose","--env-file",".env.example","config","--format","json"],{encoding:"utf8"})); const p=x.services.backend.ports; if(x.name!=="skyhub-next"||p.length!==1||Number(p[0].published)!==4001||Number(p[0].target)!==4000||p[0].host_ip!=="127.0.0.1"||x.services.emqx) process.exit(1);'
      - name: Assert Pilot 2 disabled by default and Pi broker unchanged
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); const x=JSON.parse(execFileSync("docker",["compose","--env-file",".env.example","config","--format","json"],{encoding:"utf8"})); const e=x.services.backend.environment; if(e.SKYHUB_PILOT_ENABLED!=="false"||e.SKYHUB_PILOT_MQTT_URL!=="mqtt://192.168.178.63:1884"||e.SKYHUB_BIND_ADDRESS!=="127.0.0.1") process.exit(1);'

      - name: Build the SkyHub Next container
        run: docker build -f backend/Dockerfile -t skyhub-next:test .
      - name: Smoke-test bundled runtime modules in the image
        run: |
          docker run --rm --network none --entrypoint node skyhub-next:test \
            -e '["./catalog","./dji","./registry","./mqtt-config","./mqtt-metrics","./pilot-config","./topology-ack","./mqtt-shape","./pilot-pairing","./topology-store","./hms-catalog","./track-policy","./track-store","./track-recorder","./lan-access","./message-guard","./map-element-api","./map-element-contract","./map-element-store","./map-element-permissions","./map-element-mutation"].forEach(require)'

  isolated-postgis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_USER: skyhub_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: skyhub_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U skyhub_test -d skyhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked test dependencies
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Run real SQL and PostGIS integration in dedicated test database
        env:
          SKYHUB_TEST_DATABASE_URL: postgresql://skyhub_test:local_ci_only@127.0.0.1:55432/skyhub_test
        run: node --test backend/test/postgis.integration.test.js backend/test/map-element-mutation.integration.test.js

  isolated-postgis-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and fail-closed invocation checks
        run: |
          bash -n scripts/ci-postgis-restore.sh
          if SKYHUB_CI_RESTORE_TEST= bash scripts/ci-postgis-restore.sh; then
            echo "Restore guard unexpectedly permitted execution" >&2
            exit 1
          else
            test "$?" -eq 2
          fi
      - name: Run actual pg_dump and pg_restore against isolated ephemeral PostGIS
        env:
          SKYHUB_CI_RESTORE_TEST: isolated
        run: bash scripts/ci-postgis-restore.sh
