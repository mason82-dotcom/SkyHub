name: SkyHub TAK UI browser acceptance

on:
  push:
    branches:
      - main
      - feature/tak-tab-mainbase-20261023
  pull_request:
    paths:
      - "frontend/public/**"
      - "scripts/tak-ui-browser-ci.js"
      - ".github/workflows/tak-ui-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tak-ui-browser-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  real-frontend-with-synthetic-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser dependencies (no production dependency changes)
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/skyhub-browser-acceptance"
          mkdir -p "$test_dir"
          npm install --prefix "$test_dir" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund \
            playwright@1.56.1 leaflet@1.9.4 socket.io@4.8.1
          "$test_dir/node_modules/.bin/playwright" install --with-deps chromium
          echo "SKYHUB_BROWSER_DEPS=$test_dir/node_modules" >> "$GITHUB_ENV"
      - name: Browser acceptance against actual dashboard, real Leaflet and Socket.IO
        env:
          SKYHUB_BROWSER_ARTIFACTS: browser-evidence
        run: node scripts/tak-ui-browser-ci.js
      - name: Upload screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyhub-tak-tabs-chromium-evidence
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 14

  # Temporary, PR-scoped fallback: the main CI and M3M acceptance workflows
  # currently report zero-job failures before executing tests. Revisit/remove
  # this guard once the dedicated workflow scheduler is operational.
  m3m-synthetic-fallback:
    name: M3M offline raster, auth catalog and UI tests (fallback)
    if: github.event_name == 'pull_request' && github.head_ref == 'integrate/m3m-smart-farming-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install optional raster wheels in disposable runner
        run: python -m pip install --only-binary=:all: -r backend/workers/m3m_requirements.txt
      - name: Install locked backend test dependencies (no scripts)
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Validate synthetics, raster QA, tokens and fail-closed flags
        env:
          SKYHUB_M3M_OFFLINE_LAB: "1"
        run: bash scripts/m3m-offline-verify.sh
