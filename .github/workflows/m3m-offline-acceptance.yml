name: Isolated M3M Smart Farming acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/m3m-offline-acceptance.yml"
      - "backend/server.js"
      - "backend/smart-farming-catalog.js"
      - "backend/test/smart-farming-*.test.js"
      - "backend/workers/m3m_*"
      - "frontend/public/smart-farming*"
      - "frontend/test/smart-farming-ui.test.js"
      - "tests/test_m3m_*.py"
  push:
    branches:
      - "feature/m3m-consolidated-main-latest-20261023"
      - main
    paths:
      - ".github/workflows/m3m-offline-acceptance.yml"
      - "backend/smart-farming-catalog.js"
      - "backend/workers/m3m_*"
      - "frontend/public/smart-farming*"
      - "frontend/test/smart-farming-ui.test.js"
      - "tests/test_m3m_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3m-offline-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  catalog-http-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked backend dependencies without scripts
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Run auth, immutable-catalog and UI contract regression
        run: |
          node --test backend/test/smart-farming-catalog.test.js backend/test/smart-farming-catalog-http.test.js frontend/test/smart-farming-ui.test.js
      - name: Assert no enabled M3M catalog in default Docker Compose
        run: |
          docker compose --env-file .env.example config --quiet
          node -e 'const {execFileSync}=require("node:child_process");const c=JSON.parse(execFileSync("docker",["compose","--env-file",".env.example","config","--format","json"],{encoding:"utf8"}));const e=c.services.backend.environment;if(e.SKYHUB_M3M_CATALOG_ENABLED==="true"||e.SKYHUB_M3M_CATALOG_ROOT||e.SKYHUB_M3M_CATALOG_SHA256||c.services.m3m)process.exit(1);'

  raster-synthetic-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install binary offline raster libraries only
        run: python -m pip install --only-binary=:all: -r backend/workers/m3m_requirements.txt
      - name: Syntax and execution of all M3M security and raster regression cases
        run: |
          python -m py_compile backend/workers/m3m_*.py
          python -m unittest discover -s tests -p 'test_m3m_*.py' -v
      - name: Prove CLI help never accesses DJI or Pi
        run: |
          python backend/workers/m3m_dedal_offline_pipeline.py --help
          python backend/workers/m3m_smart_farming_candidate.py --help
