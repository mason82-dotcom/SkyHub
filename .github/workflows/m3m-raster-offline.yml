name: SkyHub M3M raster offline PoC

on:
  push:
    branches:
      - "feature/m3m-reflectance-poc-*"
      - "feature/m3m-raw-tiff-payload-audit-*"
      - "feature/m3m-dedal-ortho-handoff-*"
      - "feature/m3m-dedal-preflight-*"
      - "feature/m3m-dedal-archive-inspection-*"
      - "feature/m3m-dedal-offline-pipeline-*"
      - "feature/m3m-raster-bundle-qa-*"
  pull_request:
    paths:
      - "backend/workers/m3m_reflectance_indices.py"
      - "backend/workers/m3m_requirements.txt"
      - "tests/test_m3m_reflectance_indices.py"
      - "backend/workers/m3m_raw_tiff_audit.py"
      - "tests/test_m3m_raw_tiff_audit.py"
      - "backend/workers/m3m_dedal_ortho_handoff.py"
      - "tests/test_m3m_dedal_ortho_handoff.py"
      - "backend/workers/m3m_dedal_preflight.py"
      - "tests/test_m3m_dedal_preflight.py"
      - "backend/workers/m3m_dedal_archive_inspect.py"
      - "backend/workers/m3m_dedal_manifest_recheck.py"
      - "tests/test_m3m_dedal_archive_inspect.py"
      - "tests/test_m3m_dedal_manifest_recheck.py"
      - "backend/workers/m3m_dedal_offline_pipeline.py"
      - "tests/test_m3m_dedal_offline_pipeline.py"
      - "backend/workers/m3m_raster_bundle_verify.py"
      - "tests/test_m3m_raster_bundle_verify.py"
      - ".github/workflows/m3m-raster-offline.yml"

permissions:
  contents: read

jobs:
  m3m-raster-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional raster dependencies on isolated runner
        run: python -m pip install --only-binary=:all: -r backend/workers/m3m_requirements.txt
      - name: Compile and validate offline M3M worker
        run: |
          python -m py_compile backend/workers/m3m_reflectance_indices.py backend/workers/m3m_raw_tiff_audit.py backend/workers/m3m_dedal_ortho_handoff.py backend/workers/m3m_dedal_preflight.py backend/workers/m3m_dedal_archive_inspect.py backend/workers/m3m_dedal_manifest_recheck.py backend/workers/m3m_dedal_offline_pipeline.py backend/workers/m3m_raster_bundle_verify.py
          python -m unittest discover -s tests -p 'test_m3m_reflectance_indices.py' -v
          python -m unittest discover -s tests -p 'test_m3m_raw_tiff_audit.py' -v
          python -m unittest discover -s tests -p 'test_m3m_dedal_ortho_handoff.py' -v
          python -m unittest discover -s tests -p 'test_m3m_dedal_preflight.py' -v
          python -m unittest discover -s tests -p 'test_m3m_dedal_archive_inspect.py' -v
          python -m unittest discover -s tests -p 'test_m3m_dedal_manifest_recheck.py' -v
          python -m unittest discover -s tests -p 'test_m3m_dedal_offline_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_m3m_raster_bundle_verify.py' -v
          python backend/workers/m3m_reflectance_indices.py --help
          python backend/workers/m3m_raw_tiff_audit.py --help
          python backend/workers/m3m_dedal_ortho_handoff.py --help
          python backend/workers/m3m_dedal_preflight.py --help
          python backend/workers/m3m_dedal_archive_inspect.py --help
          python backend/workers/m3m_dedal_manifest_recheck.py --help
          python backend/workers/m3m_dedal_offline_pipeline.py --help
          python backend/workers/m3m_raster_bundle_verify.py --help
