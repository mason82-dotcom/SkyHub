<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKY//PULSE — HyperFrames GFX Intro (Konzept)</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#07101c;color:#f2f8ff}
    #gfx-root{width:1920px;height:1080px;overflow:hidden;position:relative;
      background:radial-gradient(circle at 68% 40%,#163347 0,#07101c 64%);
      font-family:Arial,sans-serif;color:#f2f8ff}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <div id="gfx-root" data-composition-id="skyhub-gfx-intro" data-start="0"
       data-duration="8" data-width="1920" data-height="1080" data-track-index="0">
    <div id="gfx-hero-host" data-composition-id="skyhub-gfx-hero"
         data-composition-src="./compositions/hero.html"
         data-start="0" data-duration="8" data-track-index="1"
         data-width="1920" data-height="1080"></div>
  </div>
  <script>
    window.__timelines=window.__timelines||{};
    // Nested timeline is mounted by HyperFrames; do not add it manually.
    window.__timelines['skyhub-gfx-intro']=gsap.timeline({paused:true});
  </script>
</body>
</html>
